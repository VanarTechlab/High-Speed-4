# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "High Speed 4"
id = "SLUS-00826"
players = 2
exe = "disc/SLUS_008.26"
disc = "/mnt/d/Proyectos/NFS4/disco/Need for Speed - High Stakes (USA).cue"
load_address = "0x801D0000"
entry_pc = "0x801D0404"
text_size = "0x00007000"
stack_base = "0x801FFFF0"
# High Speed 4: solo el disco original USA (sha256 de la pista de datos .bin, medido 2026-11-18).
required_disc_sha256 = ["f0436c8dc7cf13d73974d75c2cc20bc35543726a5ca5bf51f88f961f6a28fe5d"]

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Need for Speed - High Stakes (USA).bin"
cue_name = "Need for Speed - High Stakes (USA).cue"
boot_exe = "SLUS_008.26"
known_sizes = [733165440]
known_md5 = [
  "4080f2fe29a179a6f20c8581dcdd3fd2",
]
known_sha1 = [
  "72e5fc9254903797a08d56babbef689e30514fb8",
]
known_crc32 = [
  "81456f7b",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "High Speed 4"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# Hilo de dibujo aparte: necesario con texturas HD (el dibujo extra no le quita tiempo al juego/audio).
render_thread = true

# Widescreen (activated by the nfshs.widescreen mod in the launcher).
# native_wide = false -> GTE X-squash (DuckStation-style wider FOV) instead of
# native-wide, which needs per-game cull work before it shows extra view.
[widescreen]
native_wide = false
# NFS4 is a 3D game: treat frames with GTE projection as gameplay (stretch +
# squash) instead of waiting for sprite tags, which this title never emits.
gte_game_mode = true
# Game-state word found by RAM diff (menus = 3, race and race pause = 1).
# When set, this decides gameplay vs 4:3 menus instead of the GTE heuristic,
# so menus stay native 4:3 (no HUD squash on menu text) and pausing a race
# no longer drops to 4:3.
gameplay_state_addr = "0x8010FB90"
gameplay_state_values = ["0x00000001"]
# Keep HUD widgets (timer, speedometer, minimap) at native proportions.
# OFF 2026-11-16: trataba como HUD los letreros/paredes cercanos de la capa delantera
# (panel separado de sus patas, manchas violetas). El HUD ya lo colocan el mod
# nfshs.widescreen y el parche de gpu.c: con OFF se ve proporcionado y en su sitio.
auto_ui_squash = false
# auto_ui_anchor = "in_place" was tried: it split the timer icon from its
# digits and the minimap brackets from the map, so keep the default "edges".

# Note: with native_wide = false (GTE X-squash) the whole wide view is projected
# into the original 0..W screen, so the game's own screen-space rejects stay
# correct and [widescreen.cull] screen-X sites have nothing to fix. The
# remaining edge pop-in comes from a pre-projection (3D) visibility test.

# Remove the original PS1 slowdowns: each MIPS instruction costs 1/N of its
# PS1 time, so the game never runs out of frame time. VBlank-paced games keep
# their speed (NFS4 targets 30 fps). 1 = faithful.
# Side visibility (4 functions: track blocks 0x8007E71C, track sub-blocks
# 0x800C7288, scenery objects 0x800C9DFC / 0x800CA618): each one drops a piece
# when all 4 camera-space corners have x > z (right) or -x > z (left), a fixed
# 90-degree field. Forcing those compares to "keep" ([[widescreen.cull.keep]])
# also drew pieces almost behind the camera, whose vertices saturate the GTE
# and showed as stretched bands. Instead the [[recompiler.patch]] list at the
# end widens the test to x/4 > z (about 152 degrees; x/2 still lost side
# objects). Vertices stay inside the GTE screen range, so no bands.
[timing]
# 2 = el juego cree tener una CPU el doble de rapida: sin ralentizaciones con muchos coches.
# Necesita los overlays con native CPU spans (compile_overlays.py) para no saturar el PC.
guest_cycle_scale = 2
# Solo en carrera (y su pausa): misma direccion que gameplay_state_addr. Menus/videos en 1.
guest_cycle_scale_gate = [ { addr = 0x8010FB90, value = 1 } ]
# Contabilidad agrupada (mismos tiempos para el juego, algo menos de trabajo). Probado 2026-11-15.
guest_cycle_scale_batch = true

[controller]
# NFS4 reads DualShock analog steering; the pad otherwise boots digital and the
# game never requests analog itself. Lock it so the left stick is a real axis.
default_mode = "analog"
lock_mode = true

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "3b9c3df2d89836012828fddb439794c8469f6ea671dad06768304c51ca21c547"

